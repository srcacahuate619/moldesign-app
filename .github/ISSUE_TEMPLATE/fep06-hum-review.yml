name: FEP-06-HUM review
description: Blind audit of a MolDesign run package (challenge/FEP-06-HUM). One issue per package.
title: "[FEP-06-HUM] P0X review"
labels: ["fep06-hum"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking part. Rules and the 14 needs: `challenge/FEP-06-HUM/README.md`.
        If you only want to sign up, fill in your name and background, leave the rest empty, and we will assign you two packages.
  - type: input
    id: nombre
    attributes:
      label: Name for the credits
      description: The name to show in the app's About page and in the write-up (a handle is fine).
    validations:
      required: true
  - type: input
    id: perfil
    attributes:
      label: Background
      description: For example FEP with FEP+, OpenFE or Amber; MD; docking; structural biology. Years of experience, optional.
    validations:
      required: true
  - type: dropdown
    id: paquete
    attributes:
      label: Package
      options: ["Sign-up only", P01, P02, P03, P04, P05, P06, P07, P08, P09, P10]
    validations:
      required: true
  - type: dropdown
    id: veredicto
    attributes:
      label: Verdict
      options: [READY_TO_PREPARE, PREPARABLE_WITH_QUESTIONS, NOT_PREPARABLE, "Not reviewed yet"]
  - type: textarea
    id: necesidades
    attributes:
      label: The 14 handoff needs
      description: One line per need — state, and the file or field that supports it.
      value: |
        N01 source and biological assembly:
        N02 prepared receptor (kept / removed / why):
        N03 receptor protonation in the site:
        N04 ligand identity:
        N05 ligand protonation and tautomer:
        N06 starting pose and provenance:
        N07 waters:
        N08 metals, cofactors, coordination:
        N09 missing atoms or residues in the site:
        N10 altlocs:
        N11 covalent binding or membrane:
        N12 versions, seeds, parameters, hashes:
        N13 decision log:
        N14 experimental reference / atom mapping:
  - type: textarea
    id: perdidas
    attributes:
      label: Silent losses or changes
      description: Anything dropped or altered from the source structure without being declared. Give the file and the line or field.
  - type: textarea
    id: preguntas
    attributes:
      label: Questions you would ask the sender before running FEP
  - type: input
    id: tiempo
    attributes:
      label: Time spent (minutes)
  - type: textarea
    id: fuentes
    attributes:
      label: What else did you consult?
      description: The PDB entry, the literature, the OpenFF benchmark, tools... and whether a language model helped (and how).
    validations:
      required: true
