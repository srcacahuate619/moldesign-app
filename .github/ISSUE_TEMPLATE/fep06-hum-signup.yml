name: FEP-06-HUM sign-up
description: Take part in the blind audit challenge (challenge/FEP-06-HUM). Sign-up only; reviews are sent privately.
title: "[FEP-06-HUM] Sign-up"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking part. Rules and the 14 needs: `challenge/FEP-06-HUM/README.md`.
        **Do not post findings here.** Issues are public, and each review has to be independent. We reply with the two
        packages assigned to you and how to reach us privately; send your review with `challenge/FEP-06-HUM/REVIEW_FORM.md` by Reddit
        message to [u/MolDesign](https://www.reddit.com/user/MolDesign/) or email to moldesign619@gmail.com.
  - type: input
    id: nombre
    attributes:
      label: Name for the credits
      description: The name to show in the app's About page and in the write-up (a handle is fine, or "anonymous").
    validations:
      required: true
  - type: input
    id: perfil
    attributes:
      label: Background
      description: For example FEP with FEP+, OpenFE or Amber; MD; docking; structural biology. Years of experience, optional.
    validations:
      required: true
  - type: input
    id: contacto
    attributes:
      label: How should we send you your packages?
      description: Your Reddit username or an email address. If you'd rather not write it here, leave it empty and send us a private message.
