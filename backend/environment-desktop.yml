# environment-desktop.yml
# Entorno conda para el BACKEND en modo DESKTOP.
# Solo las dependencias que necesitan conda-forge (rdkit principalmente).
# El resto se instala vía pip desde requirements-desktop.txt.
#
# Crear con:
#   micromamba create -n moldesign-backend -f environment-desktop.yml
#   micromamba activate moldesign-backend
#   pip install -r requirements-desktop.txt

name: moldesign-backend
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11.*
  - rdkit>=2024.03
  - numpy>=2.0
  - gcc          # Para compilar extensiones nativas en Linux
  - setuptools==69.5.1

  # pip extras instalados desde requirements-desktop.txt:
  - pip
  - pip:
    - fastapi==0.135.2
    - "uvicorn[standard]==0.42.0"
    - pydantic==2.12.5
    - pydantic-settings==2.13.1
    - python-multipart==0.0.22
    - python-dotenv==1.2.2
    - SQLAlchemy==2.0.49
    - aiosqlite>=0.19.0
    - httpx==0.28.1
    - meeko==0.7.1
    - openbabel-wheel==3.1.1.23
    - "MDAnalysis==2.10.0"
    - prolif==2.1.0
    - prody
    - xgboost==3.2.0
    - scikit-learn==1.8.0
    - shap==0.51.0
    - scipy==1.17.1
    - pandas==3.0.2
    - numba==0.65.0
    - reportlab==4.2.0
    - pillow==12.2.0
    - PyJWT==2.8.0
    - argon2-cffi==23.1.0
    - "cryptography==42.0.7"
    - structlog==25.5.0
    - psutil==7.2.2
    - tenacity==9.1.4
    - python-dateutil==2.9.0.post0
    - anthropic==0.86.0
    - dimorphite_dl==2.0.2
