[package]
name = "moldesign"
version = "1.0.1"
description = "MolDesign — Evidencia estructural reproducible para investigación"
authors = ["MolDesign"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/srcacahuate619/moldesign-app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2"
# Apertura de URLs en el navegador del sistema. Sin este plugin un
# `<a target="_blank">` dentro del webview no hace NADA: no hay navegador que
# abra una pestana, y el clic se perdia en silencio. La capability concede
# unicamente `opener:allow-open-url`: ni ejecucion, ni apertura de rutas, ni
# reveal en el explorador.
tauri-plugin-opener = "2"
# Selector nativo de carpetas para el espacio de trabajo de casos.
tauri-plugin-dialog = "2"
# Reemplazo atomico real de case.json: ReplaceFileW/MoveFileExW en Windows,
# rename(2) en Unix. std::fs no expone una primitiva que reemplace sin borrar.
atomicwrites = "0.4"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["stream", "blocking", "json"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
zip = "2.4"
tauri-plugin-single-instance = "2"

# Un Job Object con KILL_ON_JOB_CLOSE hace que el backend de escritorio no
# sobreviva si el contenedor se corta con Ctrl+C o se aborta antes del evento
# normal de cierre de ventana.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
