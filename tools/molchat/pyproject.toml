[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moldesign-molchat"
version = "0.1.0"
description = "Auditable local-first computational chemistry agent for MolDesign"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
server = ["starlette>=0.37,<2", "uvicorn>=0.29,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23",
       "starlette>=0.37,<2", "uvicorn>=0.29,<1"]

[project.scripts]
molchat-agent = "molchat_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molchat_agent = ["conversation/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "contract: live requests against a real MolDesign (manual, needs backend + token)",
]
addopts = ["-m", "not contract"]
